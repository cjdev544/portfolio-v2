services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_WEB3FORMS_ACCESS_KEY: ${VITE_WEB3FORMS_ACCESS_KEY:?VITE_WEB3FORMS_ACCESS_KEY is required}
    container_name: portfolio
    restart: unless-stopped
    networks:
      - default
      - web

networks:
  web:
    external: true
