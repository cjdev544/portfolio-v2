server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las rutas conocidas (/ y /proyectos/<id>) se prerenderizan en el build a
    # <ruta>/index.html. Cualquier otra ruta cae en spa.html, un shell vacío
    # que react-router renderiza en cliente (p. ej. "Proyecto no encontrado").
    location / {
        try_files $uri $uri/index.html /spa.html;
    }
}
