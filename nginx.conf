server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las rutas conocidas (/ y /proyectos/<id>) se prerenderizan en el build a
    # <ruta>/index.html. Cualquier otra ruta devuelve un 404 real con la página
    # 404.html, que react-router hidrata como la ruta "*".
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
