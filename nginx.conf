server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom uses client-side routing — any path that isn't a real
    # static file must fall back to index.html, or refreshing on a deep
    # link returns nginx's 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
